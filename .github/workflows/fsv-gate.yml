name: FSV Gate

# Institutionalises the no-mock / no-cover-up rule and runs the portable subset
# of the Full State Verification suite (issue #58). GPU/model-dependent FSV runs
# on the self-hosted Blackwell box, not here — those tests are marked
# `integration` and skip cleanly when CUDA/models are absent (never false-pass).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fsv-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.13"

      - name: Set up Python
        run: uv python install 3.13

      - name: Resolve + install (proves issue #1 resolution holds)
        run: uv sync --extra dev --locked

      - name: No-mock / no-masking gate (issue #58)
        run: uv run python scripts/check_no_mocks.py

      - name: Portable FSV (packaging #1/#2/#61, offline #59, paths #29)
        run: |
          uv run pytest -v -p no:cacheprovider -m "not integration" \
            tests/test_packaging_fsv.py \
            tests/test_offline_enforcement_fsv.py \
            tests/test_paths_fsv.py
